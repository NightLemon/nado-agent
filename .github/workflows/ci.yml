name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Scan publishable source for secrets
        run: |
          ! rg -n --hidden -S "(OPENAI_API_KEY|ANTHROPIC_API_KEY|GITHUB_TOKEN|AZURE_.*SECRET|api[_-]?key\s*[:=]|password\s*[:=]|-----BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY-----|ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|AKIA[0-9A-Z]{16})" \
            -g "!.git" \
            -g "!.nado" \
            -g "!node_modules" \
            -g "!docs/github-readiness.md" \
            -g "!.github/workflows/ci.yml"

  docker:
    runs-on: ubuntu-latest
    env:
      NADO_TOKEN: local-ci-token
      NADO_PUBLIC_CONTROL_URL: https://nado.example.com
      NADO_DOMAIN: nado.example.com
      NADO_TRUST_PROXY_SECRET: local-ci-proxy-secret
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose definitions
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.azure.yml config --quiet
          docker compose -f docker-compose.azure.yml -f docker-compose.azure-https.yml config --quiet
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e NADO_DOMAIN \
            -e NADO_TRUST_PROXY_SECRET \
            -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Compile Azure Bicep template
        run: |
          az bicep install --version v0.46.1
          az bicep build --file deploy/azure/main.bicep --stdout >/dev/null
      - name: Build Control and Worker images
        run: |
          docker build --target control -t nado-agent-control:ci .
          docker build --target worker -t nado-agent-worker:ci .
