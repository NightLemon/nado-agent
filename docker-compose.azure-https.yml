services:
  control:
    environment:
      NADO_TRUST_PROXY: "true"
      NADO_TRUST_PROXY_SECRET: ${NADO_TRUST_PROXY_SECRET:?Set a distinct proxy secret in .env}

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      control:
        condition: service_healthy
    environment:
      NADO_DOMAIN: ${NADO_DOMAIN:?Set the public DNS name in .env}
      NADO_TRUST_PROXY_SECRET: ${NADO_TRUST_PROXY_SECRET:?Set a distinct proxy secret in .env}
    ports:
      - target: 80
        published: "${NADO_HTTP_PORT:-80}"
        host_ip: "${NADO_EDGE_HOST_IP:-0.0.0.0}"
        protocol: tcp
      - target: 443
        published: "${NADO_HTTPS_PORT:-443}"
        host_ip: "${NADO_EDGE_HOST_IP:-0.0.0.0}"
        protocol: tcp
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - nado-caddy-data:/data
      - nado-caddy-config:/config
    restart: unless-stopped

volumes:
  nado-caddy-data:
  nado-caddy-config:
